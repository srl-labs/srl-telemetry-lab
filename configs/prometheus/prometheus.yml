# gnmic is scraped and the rules are evaluated every second, so a port or
# BGP session going down, streamed on change by the switches, reaches the
# dashboard within a second or two.
global:
  scrape_interval: 1s
  evaluation_interval: 1s

rule_files:
  - /etc/prometheus/rules.yml

# metrics_path defaults to '/metrics'
# scheme defaults to 'http'.
scrape_configs:
  - job_name: "gnmic"
    static_configs:
      - targets: ["gnmic:9273"]
