# config file version
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      # The scrape interval of Prometheus: queries step at 1s, so the newest
      # value is never more than a second old.
      timeInterval: 1s
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # The lab runs no Loki ruler; the alerts are Prometheus rules.
      manageAlerts: false
