---
anchors:
  thresholds-operstate: &thresholds-operstate
    - { color: "red", level: 0 }
    - { color: "green", level: 1 }
  thresholds-traffic: &thresholds-traffic
    - { color: "gray", level: 0 }
    - { color: "green", level: 10000 }
    - { color: "yellow", level: 500000 }
    - { color: "orange", level: 2000000 }
    - { color: "red", level: 5000000 }
  thresholds-rate-label: &thresholds-rate-label
    - { color: "white", level: 0 }
  label-config: &label-config
    separator: "replace"
    units: "bps"
    decimalPoints: 1
    valueMappings:
      - { valueMax: 10000, text: "\u200B" }
cellIdPreamble: "cell-"
tagConfig:
  legend: ["hide-rates"]
  lowlightAlphaFactor: 0
  highlightRgbFactor: 1
cells:
  "spine1:e1-1":
    dataRef: "oper-state:spine1:e1-1"
    fillColor:
      thresholds: *thresholds-operstate
    tags: ["hide-rates"]
  "leaf1:e1-49":
    dataRef: "oper-state:leaf1:e1-49"
    fillColor:
      thresholds: *thresholds-operstate
    tags: ["hide-rates"]
  "link_id:spine1:e1-1:leaf1:e1-49":
    dataRef: "spine1:e1-1:out"
    strokeColor:
      thresholds: *thresholds-traffic
    tags: ["hide-rates"]
  "link_id:spine1:e1-1:leaf1:e1-49:label":
    dataRef: "spine1:e1-1:out"
    label: *label-config
    labelColor:
      thresholds: *thresholds-rate-label
